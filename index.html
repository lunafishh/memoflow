<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memoflow</title>
  
  <!-- Icônes & PWA Manifest -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%23B23B69'/%3E%3Cpath d='M46 35.4A18 18 0 0 1 26.4 16a14 14 0 1 0 19.6 19.4z' fill='none' stroke='%23FFFFFF' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Polices Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================================
       1. TOKENS MATERIAL 3 EXPRESSIVE (LIGHT PINKY RED V1.113)
    ====================================================================== */
    :root {
      --md-sys-color-primary: #B23B69;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #FFD9E4;
      --md-sys-color-on-primary-container: #3B001F;

      --md-sys-color-secondary: #7B5263;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #FFD9E4;
      --md-sys-color-on-secondary-container: #31111E;

      --md-sys-color-tertiary: #845330;
      --md-sys-color-on-tertiary: #FFFFFF;
      --md-sys-color-tertiary-container: #FFDCB9;
      --md-sys-color-on-tertiary-container: #2C1500;

      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #410002;

      --md-sys-color-background: #FFF5F7;
      --md-sys-color-on-background: #23191D;
      --md-sys-color-surface: #FFF5F7;
      --md-sys-color-on-surface: #23191D;
      --md-sys-color-surface-variant: #F2DDE3;
      --md-sys-color-on-surface-variant: #524348;

      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-color-surface-container-low: #FCEAEF;
      --md-sys-color-surface-container: #F6E2E8;
      --md-sys-color-surface-container-high: #F0D9E2;
      --md-sys-color-surface-container-highest: #EAD0DB;

      --md-sys-color-outline: #857379;
      --md-sys-color-outline-variant: #D7C1C8;

      --md-sys-color-success: #1B6D32;
      --md-sys-color-on-success: #FFFFFF;
      --md-sys-color-success-container: #C4F1CC;
      --md-sys-color-on-success-container: #002109;

      --md-sys-shape-corner-small: 10px;
      --md-sys-shape-corner-medium: 16px;
      --md-sys-shape-corner-large: 24px;
      --md-sys-shape-corner-extra-large: 32px;
      --md-sys-shape-corner-full: 9999px;

      --md-sys-typescale-display: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --md-sys-typescale-body: 'Inter', system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --md-sys-color-primary: #FFB0CD;
      --md-sys-color-on-primary: #650035;
      --md-sys-color-primary-container: #8C1C4E;
      --md-sys-color-on-primary-container: #FFD9E4;

      --md-sys-color-secondary: #E5B8CB;
      --md-sys-color-on-secondary: #432534;
      --md-sys-color-secondary-container: #5C3B4A;
      --md-sys-color-on-secondary-container: #FFD9E4;

      --md-sys-color-tertiary: #F7B98E;
      --md-sys-color-on-tertiary: #4A2807;
      --md-sys-color-tertiary-container: #653D1C;
      --md-sys-color-on-tertiary-container: #FFDCB9;

      --md-sys-color-error: #FFB4AB;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000A;
      --md-sys-color-on-error-container: #FFDAD6;

      --md-sys-color-background: #1A1115;
      --md-sys-color-on-background: #F1D9E1;
      --md-sys-color-surface: #1A1115;
      --md-sys-color-on-surface: #F1D9E1;
      --md-sys-color-surface-variant: #524348;
      --md-sys-color-on-surface-variant: #D7C1C8;

      --md-sys-color-surface-container-lowest: #140C0F;
      --md-sys-color-surface-container-low: #23191D;
      --md-sys-color-surface-container: #281D22;
      --md-sys-color-surface-container-high: #33272D;
      --md-sys-color-surface-container-highest: #3F3238;

      --md-sys-color-outline: #9F8C93;
      --md-sys-color-outline-variant: #524348;

      --md-sys-color-success: #79DC8D;
      --md-sys-color-on-success: #003913;
      --md-sys-color-success-container: #00531F;
      --md-sys-color-on-success-container: #C4F1CC;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      font-family: var(--md-sys-typescale-body);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, .font-display { font-family: var(--md-sys-typescale-display); margin: 0; }
    p { margin: 0; }
    button, input, select, textarea { font-family: inherit; color: inherit; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    @keyframes slowHaloShift {
      0% { transform: translate3d(-53%, 0px, 0) scale(1); }
      50% { transform: translate3d(-47%, 30px, 0) scale(1.12); }
      100% { transform: translate3d(-53%, 0px, 0) scale(1); }
    }
    @keyframes slowGradientPan {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .m3-ambient-halo {
      position: fixed; top: -160px; left: 50%;
      width: min(1400px, 130vw); height: 500px;
      background:
        radial-gradient(ellipse at 28% 20%, color-mix(in srgb, var(--md-sys-color-primary-container) 82%, transparent) 0%, transparent 64%),
        radial-gradient(ellipse at 72% 25%, color-mix(in srgb, var(--md-sys-color-tertiary-container) 68%, transparent) 0%, transparent 66%),
        radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--md-sys-color-secondary-container) 65%, transparent) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      animation: slowHaloShift 22s ease-in-out infinite;
    }

    .app-shell { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
    @media (min-width: 840px) { .app-shell { flex-direction: row; } }

    .m3-nav-sidebar {
      position: sticky; top: 0; z-index: 40;
      background-color: var(--md-sys-color-surface-container-low);
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    @media (min-width: 840px) {
      .m3-nav-sidebar { height: 100vh; width: 244px; flex-shrink: 0; flex-direction: column; align-items: stretch; padding: 22px 14px; }
    }

    .brand-trigger {
      display: inline-flex; align-items: center; gap: 12px; background: transparent; border: none;
      padding: 6px 8px; border-radius: var(--md-sys-shape-corner-large); cursor: pointer; text-align: left;
    }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 15px; background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-name { font-family: var(--md-sys-typescale-display); font-weight: 800; font-size: 1.12rem; letter-spacing: -0.02em; color: var(--md-sys-color-on-surface); }
    .m3-badge-pill {
      display: inline-flex; align-items: center; padding: 4px 11px; border-radius: var(--md-sys-shape-corner-full);
      background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
      font-size: 0.72rem; font-weight: 700;
    }

    .nav-drawer-list { display: none; flex-direction: column; gap: 8px; margin-top: 24px; }
    @media (min-width: 840px) { .nav-drawer-list { display: flex; } }

    .m3-nav-item {
      position: relative; display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 12px 16px; border: none; border-radius: var(--md-sys-shape-corner-full); background: transparent;
      color: var(--md-sys-color-on-surface-variant); font-size: 0.88rem; font-weight: 600; cursor: pointer;
    }
    .m3-nav-item:hover { background-color: color-mix(in srgb, var(--md-sys-color-on-surface) 6%, transparent); }
    .m3-nav-item.active { background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); font-weight: 700; }
    .nav-item-left { display: flex; align-items: center; gap: 12px; }
    .nav-counter-pill { padding: 3px 9px; border-radius: var(--md-sys-shape-corner-full); font-size: 0.72rem; font-weight: 700; background-color: color-mix(in srgb, var(--md-sys-color-on-secondary-container) 12%, transparent); }

    .sidebar-footer { display: none; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 12px; }
    @media (min-width: 840px) { .sidebar-footer { display: flex; } }

    .mastery-summary-card { padding: 14px; border-radius: var(--md-sys-shape-corner-large); background-color: var(--md-sys-color-surface-container); display: flex; flex-direction: column; gap: 10px; }
    .mastery-summary-header { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--md-sys-color-on-surface); }
    .sidebar-course-select { flex: 1; min-width: 0; background: transparent; border: none; font-size: 0.78rem; font-weight: 700; color: var(--md-sys-color-on-surface); outline: none; cursor: pointer; padding: 0; }
    .m3-wavy-progress { width: 100%; height: 14px; display: block; overflow: visible; }

    .m3-bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background-color: var(--md-sys-color-surface-container-low); padding: 10px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (min-width: 840px) { .m3-bottom-bar { display: none; } }
    .m3-bottom-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 12px; border: none; background: transparent; color: var(--md-sys-color-on-surface-variant); font-size: 0.74rem; font-weight: 600; cursor: pointer; }
    .m3-bottom-item .icon-pill { padding: 6px 24px; border-radius: var(--md-sys-shape-corner-full); display: flex; align-items: center; justify-content: center; }
    .m3-bottom-item.active { color: var(--md-sys-color-on-surface); font-weight: 700; }
    .m3-bottom-item.active .icon-pill { background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }

    .main-workspace { flex: 1; min-width: 0; max-width: 1100px; width: 100%; margin: 0 auto; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 14px; }
    @media (min-width: 840px) { .main-workspace { padding: 22px 28px 36px; gap: 16px; } }

    body.focus-fullscreen .m3-nav-sidebar,
    body.focus-fullscreen .m3-bottom-bar,
    body.focus-fullscreen #revise-controls-bar,
    body.focus-fullscreen #batch-tracker-bar { display: none !important; }
    body.focus-fullscreen .main-workspace { max-width: 100%; min-height: 100vh; padding: 16px; justify-content: center; }
    body.focus-fullscreen #view-revise { flex: 1; max-width: 1140px; width: 100%; margin: 0 auto; }
    body.focus-fullscreen .m3-hero-learning-card { flex: 1; display: flex; flex-direction: column; }
    body.focus-fullscreen .hero-card-body { flex: 1; justify-content: space-between; }

    .m3-theme-pill { display: inline-flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px; padding: 8px 12px; border-radius: var(--md-sys-shape-corner-full); background-color: var(--md-sys-color-surface-container-lowest); }
    .seed-swatches { display: inline-flex; align-items: center; gap: 8px; }
    .seed-swatch-btn { width: 26px; height: 26px; border-radius: var(--md-sys-shape-corner-full); border: 2px solid transparent; padding: 0; cursor: pointer; position: relative; }
    .seed-swatch-btn.active { box-shadow: 0 0 0 2px var(--md-sys-color-surface-container-lowest), 0 0 0 4px var(--md-sys-color-primary); }

    .custom-color-label { width: 26px; height: 26px; border-radius: var(--md-sys-shape-corner-full); background: conic-gradient(from 0deg, #ff595e, #ffca3a, #8ac926, #1982c4, #b23b69, #ff595e); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
    .custom-color-label input[type="color"] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none; padding: 0; }

    .theme-mode-btn { height: 32px; padding: 0 14px; border-radius: var(--md-sys-shape-corner-full); border: none; background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }

    .m3-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 22px; border-radius: var(--md-sys-shape-corner-full); font-size: 0.85rem; font-weight: 700; cursor: pointer; border: none; overflow: hidden; }
    .m3-btn:hover { filter: brightness(0.96); }
    .m3-btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .m3-btn-filled { background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
    .m3-btn-tonal { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .m3-btn-expressive { background-color: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
    .m3-btn-outlined { background-color: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-primary); }
    .m3-btn-text { background-color: transparent; color: var(--md-sys-color-primary); padding: 9px 16px; }
    .m3-btn-danger-tonal { background-color: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); }
    .m3-btn-sm { padding: 7px 15px; font-size: 0.78rem; }

    .m3-icon-btn { width: 36px; height: 36px; border-radius: 14px; border: none; background-color: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface-variant); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .m3-icon-btn:hover { background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }

    .m3-field { width: 100%; padding: 12px 16px; border-radius: var(--md-sys-shape-corner-medium); background-color: var(--md-sys-color-surface-container-lowest); border: 2px solid transparent; color: var(--md-sys-color-on-surface); font-size: 0.88rem; outline: none; }
    .m3-field:focus { border-color: var(--md-sys-color-primary); }
    .m3-select-compact { padding: 9px 16px; border-radius: var(--md-sys-shape-corner-full); background-color: var(--md-sys-color-surface-container-lowest); border: none; color: var(--md-sys-color-on-surface); font-size: 0.82rem; font-weight: 700; outline: none; cursor: pointer; }

    .m3-switch { position: relative; display: inline-block; width: 52px; height: 32px; flex-shrink: 0; cursor: pointer; }
    .m3-switch input { opacity: 0; width: 0; height: 0; }
    .m3-switch-track { position: absolute; inset: 0; border-radius: var(--md-sys-shape-corner-full); background-color: var(--md-sys-color-surface-container-highest); border: 2px solid var(--md-sys-color-outline); }
    .m3-switch-thumb { position: absolute; top: 50%; left: 6px; width: 16px; height: 16px; border-radius: var(--md-sys-shape-corner-full); background-color: var(--md-sys-color-outline); transform: translateY(-50%); }
    .m3-switch input:checked + .m3-switch-track { background-color: var(--md-sys-color-primary); border-color: var(--md-sys-color-primary); }
    .m3-switch input:checked + .m3-switch-track .m3-switch-thumb { left: 24px; width: 24px; height: 24px; background-color: var(--md-sys-color-on-primary); }

    .m3-card { background-color: var(--md-sys-color-surface-container-low); border: none; border-radius: var(--md-sys-shape-corner-large); padding: 18px 20px; }
    .m3-hero-learning-card {
      background: linear-gradient(
        135deg,
        var(--md-sys-color-surface-container-low) 0%,
        color-mix(in srgb, var(--md-sys-color-primary-container) 68%, var(--md-sys-color-surface-container-low)) 48%,
        color-mix(in srgb, var(--md-sys-color-tertiary-container) 55%, var(--md-sys-color-surface-container-low)) 100%
      );
      background-size: 240% 240%;
      animation: slowGradientPan 16s ease-in-out infinite;
      border: none; border-radius: var(--md-sys-shape-corner-extra-large); overflow: hidden; min-height: 450px; display: flex; flex-direction: column;
    }

    .hero-card-header { padding: 20px 24px 16px; background-color: color-mix(in srgb, var(--md-sys-color-surface-container-lowest) 55%, transparent); display: flex; flex-direction: column; gap: 14px; }
    .hero-header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .course-tag-row { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .course-dot { width: 11px; height: 11px; border-radius: var(--md-sys-shape-corner-full); flex-shrink: 0; }
    .course-label { font-size: 0.84rem; font-weight: 700; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .m3-stepper-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 4px; border-radius: var(--md-sys-shape-corner-full); background-color: var(--md-sys-color-surface-container-lowest); }
    @media (min-width: 600px) { .m3-stepper-grid { grid-template-columns: repeat(4, 1fr); } }

    .m3-step-chip { padding: 8px 12px; border-radius: var(--md-sys-shape-corner-full); font-size: 0.76rem; font-weight: 700; text-align: center; border: none; background-color: transparent; color: var(--md-sys-color-on-surface-variant); cursor: pointer; }
    .m3-step-chip.active { background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
    .m3-step-chip.done { background-color: var(--md-sys-color-success-container); color: var(--md-sys-color-on-success-container); }

    .hero-card-body { padding: 24px 28px 28px; display: flex; flex-direction: column; gap: 20px; flex: 1; }
    .stage-overline { font-size: 0.74rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--md-sys-color-primary); display: block; margin-bottom: 4px; }
    .notion-heading { font-family: var(--md-sys-typescale-display); font-size: clamp(1.38rem, 2.8vw, 1.9rem); font-weight: 800; line-height: 1.25; color: var(--md-sys-color-on-surface); }
    .m3-inner-well { background-color: color-mix(in srgb, var(--md-sys-color-surface-container-lowest) 88%, transparent); border: none; border-radius: var(--md-sys-shape-corner-large); padding: 22px 24px; }

    .cloze-blank-input { display: inline-block; background-color: var(--md-sys-color-primary-container); border: none; border-bottom: 2.5px solid var(--md-sys-color-primary); border-radius: 10px 10px 4px 4px; padding: 3px 9px; margin: 3px; font-weight: 700; color: var(--md-sys-color-on-primary-container); outline: none; }
    .batch-pills-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .batch-notion-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: var(--md-sys-shape-corner-full); font-size: 0.76rem; font-weight: 700; border: none; background-color: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface-variant); cursor: pointer; max-width: 220px; }
    .batch-notion-chip.current { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .batch-notion-chip.completed { background-color: var(--md-sys-color-success-container); color: var(--md-sys-color-on-success-container); }

    .tok-matched { background-color: var(--md-sys-color-success-container); color: var(--md-sys-color-on-success-container); font-weight: 700; padding: 2px 7px; border-radius: 8px; }
    .tok-missed { background-color: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; padding: 2px 7px; border-radius: 8px; }

    .courses-grid-layout { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 600px) { .courses-grid-layout { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px) { .courses-grid-layout { grid-template-columns: repeat(3, 1fr); } }
    .courses-list-layout { display: flex; flex-direction: column; gap: 10px; }
    .course-card-item { background-color: var(--md-sys-color-surface-container-low); border-radius: var(--md-sys-shape-corner-extra-large); padding: 20px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
    .course-card-item:hover { background-color: var(--md-sys-color-surface-container); }
    .course-card-item.selected { background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }

    .two-col-forms { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 760px) { .two-col-forms { grid-template-columns: 1fr 1fr; } }
    .manage-list-row { padding: 13px 16px; border-radius: var(--md-sys-shape-corner-medium); background-color: var(--md-sys-color-surface-container-lowest); display: flex; flex-direction: column; gap: 8px; }
    @media (min-width: 600px) { .manage-list-row { flex-direction: row; align-items: center; justify-content: space-between; } }

    .m3-modal-backdrop { position: fixed; inset: 0; z-index: 60; background-color: rgba(26, 17, 21, 0.48); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .m3-modal-dialog { width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; background-color: var(--md-sys-color-surface-container-low); color: var(--md-sys-color-on-surface); border-radius: var(--md-sys-shape-corner-extra-large); padding: 26px; display: flex; flex-direction: column; gap: 18px; }

    @keyframes soundWave { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    .tts-wave { display: inline-flex; align-items: center; gap: 2px; }
    .tts-wave span { display: inline-block; width: 2.5px; height: 11px; background-color: currentColor; border-radius: 9999px; animation: soundWave 0.75s ease-in-out infinite; }
    .tts-wave span:nth-child(2) { animation-delay: 0.15s; }
    .tts-wave span:nth-child(3) { animation-delay: 0.3s; }

    .m3-toast-stack { position: fixed; bottom: 84px; right: 20px; z-index: 70; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    @media (min-width: 840px) { .m3-toast-stack { bottom: 24px; } }
    .m3-snackbar { pointer-events: auto; padding: 12px 20px; border-radius: var(--md-sys-shape-corner-full); background-color: var(--md-sys-color-on-surface); color: var(--md-sys-color-surface); font-size: 0.82rem; font-weight: 700; }
  </style>
</head>

<body>
  <div class="m3-ambient-halo" aria-hidden="true"></div>

  <div class="app-shell">
    <aside aria-label="Navigation principale" class="m3-nav-sidebar">
      <div>
        <button type="button" onclick="switchTab('revise')" class="brand-trigger">
          <div class="brand-icon">
            <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
            </svg>
          </div>
          <span class="brand-name">Memoflow</span>
        </button>

        <nav class="nav-drawer-list">
          <button type="button" id="nav-btn-revise" onclick="switchTab('revise')" class="m3-nav-item active">
            <span class="nav-item-left">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
              <span>Réviser</span>
            </span>
            <span id="sidebar-mastered-pill" class="nav-counter-pill tabular-nums">0/0</span>
          </button>
          <button type="button" id="nav-btn-courses" onclick="switchTab('courses')" class="m3-nav-item">
            <span class="nav-item-left">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
              <span>Mes Cours</span>
            </span>
            <span id="sidebar-courses-count" class="nav-counter-pill tabular-nums">0</span>
          </button>
        </nav>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <button type="button" onclick="openSettingsModal()" aria-label="Paramètres" class="m3-icon-btn" id="mobile-settings-btn">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="mastery-summary-card">
          <div class="mastery-summary-header">
            <select id="sidebar-progress-course-select" onchange="onSidebarProgressCourseChange(this.value)" aria-label="Progression par matière" class="sidebar-course-select"></select>
            <span id="sidebar-course-pct" class="tabular-nums" style="color: var(--md-sys-color-primary); flex-shrink: 0;">0%</span>
          </div>
          <svg class="m3-wavy-progress" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true">
            <line id="sidebar-wavy-track" x1="0" y1="7" x2="200" y2="7" stroke="var(--md-sys-color-surface-container-highest)" stroke-width="3.5" stroke-linecap="round" />
            <path id="sidebar-wavy-fill" d="" fill="none" stroke="var(--md-sys-color-primary)" stroke-width="3.5" stroke-linecap="round" />
            <circle cx="197" cy="7" r="2.2" fill="var(--md-sys-color-primary)" />
          </svg>
          <span id="sidebar-course-detail" class="tabular-nums" style="font-size: 0.72rem; font-weight: 600; color: var(--md-sys-color-on-surface-variant);">0 / 0 validées</span>
        </div>
        <button type="button" onclick="openSettingsModal()" class="m3-nav-item" style="padding: 11px 14px;">
          <span class="nav-item-left">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            <span>Paramètres</span>
          </span>
        </button>
      </div>
    </aside>

    <nav aria-label="Navigation mobile" class="m3-bottom-bar">
      <button type="button" id="mob-nav-btn-revise" onclick="switchTab('revise')" class="m3-bottom-item active">
        <span class="icon-pill"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg></span>
        <span>Réviser</span>
      </button>
      <button type="button" id="mob-nav-btn-courses" onclick="switchTab('courses')" class="m3-bottom-item">
        <span class="icon-pill"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg></span>
        <span>Mes Cours</span>
      </button>
    </nav>

    <main class="main-workspace">
      <section id="view-revise" style="display: flex; flex-direction: column; gap: 14px;">
        <div id="revise-controls-bar" class="m3-card" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px;">
          <div style="flex: 1; min-width: 180px;">
            <select id="revise-course-filter" onchange="onCourseFilterChange(this.value)" aria-label="Choisir un cours" class="m3-select-compact" style="width: 100%; max-width: 260px;">
              <option value="all">Tous les cours</option>
            </select>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <label for="revise-batch-size" style="font-size: 0.78rem; font-weight: 700; color: var(--md-sys-color-on-surface-variant);">Lot :</label>
            <select id="revise-batch-size" onchange="onBatchSizeChange(this.value)" aria-label="Taille du lot" class="m3-select-compact">
              <option value="1">1 notion</option>
              <option value="2">2 notions</option>
              <option value="3" selected>3 notions</option>
              <option value="5">5 notions</option>
              <option value="10">10 notions</option>
              <option value="9999">Tout le cours</option>
            </select>
          </div>
        </div>

        <div id="batch-tracker-bar" class="m3-card" style="padding: 12px 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span id="batch-index-label" style="font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--md-sys-color-primary);">Lot 1 / 1</span>
              <span style="color: var(--md-sys-color-outline-variant);">•</span>
              <span id="batch-card-counter" class="tabular-nums" style="font-size: 0.78rem; font-weight: 700; color: var(--md-sys-color-on-surface-variant);">1 / 3</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <button type="button" id="btn-prev-batch" onclick="changeBatchIndex(-1)" title="Lot précédent" class="m3-icon-btn"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg></button>
              <button type="button" id="btn-next-batch" onclick="changeBatchIndex(1)" title="Lot suivant" class="m3-icon-btn"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg></button>
            </div>
          </div>
          <div id="batch-cards-pills" class="batch-pills-row"></div>
        </div>

        <div id="revise-empty-state" class="m3-card hidden" style="text-align: center; padding: 48px 24px;">
          <h3 style="font-size: 1.05rem; font-weight: 700; margin-bottom: 14px;">Aucune notion dans cette sélection</h3>
          <button type="button" onclick="switchTab('courses')" class="m3-btn m3-btn-filled">Aller à Mes Cours</button>
        </div>

        <div id="batch-complete-card" class="m3-hero-learning-card hidden" style="text-align: center; padding: 44px 24px; justify-content: center; align-items: center;">
          <div style="width: 52px; height: 52px; border-radius: 18px; background-color: var(--md-sys-color-success-container); color: var(--md-sys-color-on-success-container); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;">
            <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
          </div>
          <h2 id="batch-complete-title" style="font-size: 1.35rem; font-weight: 800; margin-bottom: 18px;">Lot 1 terminé</h2>
          <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
            <button type="button" onclick="repeatCurrentBatch()" class="m3-btn m3-btn-outlined">Revoir ce lot</button>
            <button type="button" id="btn-advance-next-batch" onclick="advanceToNextBatch()" class="m3-btn m3-btn-filled">Lot suivant →</button>
          </div>
        </div>

        <article id="flashcard-container" class="m3-hero-learning-card">
          <div class="hero-card-header">
            <div class="hero-header-top">
              <div class="course-tag-row">
                <span id="card-course-dot" class="course-dot" style="background-color: var(--md-sys-color-primary);"></span>
                <span id="card-course-name" class="course-label">Cours</span>
                <span id="card-focus-badge" class="m3-badge-pill hidden">Ciblée</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <button type="button" id="btn-tts-speak" onclick="speakCurrentCard()" title="Écouter la définition" class="m3-btn m3-btn-tonal m3-btn-sm">
                  <svg id="tts-icon-static" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                  <span id="tts-wave-anim" class="tts-wave hidden"><span></span><span></span><span></span></span>
                  <span id="tts-btn-label">Écouter</span>
                </button>
                <span id="tts-locked-badge" class="hidden" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--md-sys-shape-corner-full); background-color: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface-variant); font-size: 0.75rem; font-weight: 700;">Sans écoute</span>
                <button type="button" id="btn-toggle-fullscreen" onclick="toggleFocusFullscreen()" title="Mode plein écran" aria-label="Mode plein écran" class="m3-icon-btn">
                  <svg id="icon-fs-enter" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-5v4m0-4h-4m4 4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                  <svg id="icon-fs-exit" class="hidden" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4H4m5 5L3 3m12 6h5V4m-5 5l6-6M9 15v5H4m5-5l-6 6m12-6h5v5m-5-5l6 6" /></svg>
                </button>
              </div>
            </div>
            <div class="m3-stepper-grid" role="tablist" aria-label="Étapes de mémorisation">
              <button type="button" id="step-pill-1" onclick="jumpToStage(1)" class="m3-step-chip active">1. Écoute</button>
              <button type="button" id="step-pill-2" onclick="jumpToStage(2)" class="m3-step-chip">2. Trous + Audio</button>
              <button type="button" id="step-pill-3" onclick="jumpToStage(3)" class="m3-step-chip">3. Sans écoute</button>
              <button type="button" id="step-pill-4" onclick="jumpToStage(4)" class="m3-step-chip">4. Expert</button>
            </div>
          </div>

          <div class="hero-card-body">
            <div>
              <span id="stage-subtitle-label" class="stage-overline">Étape 1</span>
              <h1 id="card-notion-title" class="notion-heading">Chargement...</h1>
            </div>

            <div id="stage-1-view" style="display: flex; flex-direction: column; gap: 18px; flex: 1; justify-content: space-between;">
              <div class="m3-inner-well" style="display: flex; flex-direction: column; gap: 12px;">
                <p id="stage-1-definition" style="font-size: 1.1rem; font-weight: 500; line-height: 1.65;">—</p>
                <p id="stage-1-example" class="hidden" style="font-size: 0.85rem; color: var(--md-sys-color-on-surface-variant); padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 45%, transparent);"></p>
              </div>
              <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;">
                <button type="button" onclick="speakCurrentCard()" class="m3-btn m3-btn-tonal">Réécouter</button>
                <button type="button" id="btn-stage-1-next" onclick="advanceFromStage1()" class="m3-btn m3-btn-filled"><span>Texte à trous</span></button>
              </div>
            </div>

            <div id="stage-cloze-view" class="hidden" style="display: flex; flex-direction: column; gap: 18px; flex: 1; justify-content: space-between;">
              <div class="m3-inner-well" style="display: flex; flex-direction: column; gap: 14px;">
                <div style="display: flex; align-items: center; justify-content: flex-end;">
                  <button type="button" onclick="toggleClozeInitials()" id="btn-cloze-initials" class="m3-btn m3-btn-tonal m3-btn-sm">Initiales</button>
                </div>
                <div id="cloze-sentence-container" style="font-size: 1.1rem; line-height: 2.08; font-weight: 500;"></div>
              </div>
              <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;">
                <button type="button" onclick="submitClozeExercise(true)" class="m3-btn m3-btn-text">Révéler</button>
                <button type="button" onclick="submitClozeExercise(false)" class="m3-btn m3-btn-filled"><span>Vérifier</span></button>
              </div>
            </div>

            <div id="stage-expert-view" class="hidden" style="display: flex; flex-direction: column; gap: 16px; flex: 1; justify-content: space-between;">
              <textarea id="expert-answer-input" rows="5" placeholder="Restituez l’essentiel de la définition..." class="m3-field" style="resize: none; line-height: 1.65; font-size: 1.02rem;"></textarea>
              <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;">
                <button type="button" onclick="submitExpertExercise(true)" class="m3-btn m3-btn-text">Révéler</button>
                <button type="button" onclick="submitExpertExercise(false)" class="m3-btn m3-btn-filled"><span>Valider</span></button>
              </div>
            </div>

            <div id="stage-result-view" class="hidden" style="display: flex; flex-direction: column; gap: 16px; flex: 1; justify-content: space-between;">
              <div style="display: flex; flex-direction: column; gap: 14px;">
                <div id="result-banner" style="border-radius: var(--md-sys-shape-corner-large); padding: 14px 18px; display: flex; align-items: center; gap: 14px;">
                  <span id="result-score-pill" class="tabular-nums" style="padding: 6px 14px; border-radius: var(--md-sys-shape-corner-full); font-weight: 800; font-size: 0.9rem;">100%</span>
                  <h3 id="result-title" style="font-size: 0.98rem; font-weight: 800;">Validé</h3>
                </div>
                <div class="m3-inner-well" style="display: flex; flex-direction: column; gap: 12px;">
                  <div style="display: flex; align-items: center; justify-content: flex-end; font-size: 0.74rem; font-weight: 700;">
                    <span style="color: var(--md-sys-color-success);">● Retenu</span> &nbsp; <span style="color: var(--md-sys-color-error);">● Manquant</span>
                  </div>
                  <div id="result-annotated-text" style="font-size: 1.04rem; line-height: 1.78; font-weight: 500;"></div>
                  <p id="result-user-echo" style="font-size: 0.8rem; color: var(--md-sys-color-on-surface-variant); font-style: italic; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 45%, transparent);"></p>
                </div>
              </div>
              <div id="result-actions-bar" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px;"></div>
            </div>
          </div>
        </article>
      </section>

      <section id="view-courses" class="hidden" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="m3-card" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <h2 style="font-size: 1.18rem; font-weight: 800;">Mes Cours</h2>
            <span id="courses-summary-sub" class="m3-badge-pill tabular-nums">0 cours</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="display: inline-flex; padding: 3px; border-radius: var(--md-sys-shape-corner-full); background-color: var(--md-sys-color-surface-container-lowest);">
              <button type="button" id="layout-btn-grid" onclick="setCourseLayout('grid')" class="m3-btn m3-btn-sm" style="padding: 6px 12px;">Grille</button>
              <button type="button" id="layout-btn-list" onclick="setCourseLayout('list')" class="m3-btn m3-btn-sm" style="padding: 6px 12px;">Liste</button>
            </div>
            <button type="button" onclick="openCourseModal()" class="m3-btn m3-btn-expressive m3-btn-sm">+ Nouveau cours</button>
          </div>
        </div>
        <div id="courses-grid" class="courses-grid-layout"></div>
      </section>
    </main>
  </div>

  <!-- MODALES (Paramètres, Cours, etc.) -->
  <div id="modal-settings" class="m3-modal-backdrop hidden">
    <div class="m3-modal-dialog">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h3 style="font-size: 1.15rem; font-weight: 800;">Paramètres</h3>
        <button type="button" onclick="closeModal('modal-settings')" class="m3-icon-btn">✕</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div class="m3-theme-pill">
          <div class="seed-swatches">
            <button type="button" class="seed-swatch-btn active" data-seed="#B23B69" style="background-color: #B23B69;"></button>
            <button type="button" class="seed-swatch-btn" data-seed="#664998" style="background-color: #664998;"></button>
            <button type="button" class="seed-swatch-btn" data-seed="#3B5BA9" style="background-color: #3B5BA9;"></button>
